version: 2.1

orbs:
  cypress: cypress-io/cypress@2.2.0

jobs:
  install-deps:
    docker:
      - image: cimg/node:18.20-browsers
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-cypress-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-cypress-
      - run:
          name: Install dependencies
          command: |
            npm ci
            npx cypress install
      - save_cache:
          key: v1-cypress-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/Cypress
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
            - package.json
            - package-lock.json

  save-artifacts:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: .
      - store_artifacts:
          path: cypress/videos
          destination: videos
      - store_artifacts:
          path: cypress/screenshots
          destination: screenshots

workflows:
  build-and-test:
    jobs:
      - install-deps
      - cypress/run:
          requires:
            - install-deps
          parallel: true
          record: true
          parallelism: 3
          group: UI Tests
      - save-artifacts:
          requires:
            - cypress/run
